name: Verify SiteDock

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --include=dev --omit=optional --no-audit --no-fund
      - name: Run syntax and unit checks
        run: npm run check
      - name: Build official VSIX
        run: npx --no-install vsce package --allow-missing-repository --out SiteDock-v0.2.0-GigabyteGrove-Official.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitedock-v0.2.0-vsix
          path: SiteDock-v0.2.0-GigabyteGrove-Official.vsix
          if-no-files-found: error
